<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeSteps alpha prototype</title>
<meta name="robots" content="noindex">
<style>
  /* A rebuild of the SafeSteps wireframes (2025) as a clickable demo.
     Everything is made up and held in memory: no sign-in, no storage, no network.
     Accessibility: every control is a real button or input with a name, text never drops below 13px,
     colour pairs meet WCAG AA, focus is always visible, charts carry their numbers in text. */
  :root{
    --ink:#16150F; --dim:#55544C; --line:#C9C8C0; --soft:#F2F2EF;
    --blue:#2F5BC4; --blue-l:#D3DFF8; --green:#2FC95A; --green-d:#1D7A37; --mint:#BDF2D1;
    --yellow:#FFE14D; --pink:#F9C9C9; --red:#F27272; --red-d:#B42318; --orange:#F5B36B;
    --lilac:#DDD6FA; --teal:#3FE3C8; --focus:#FF1FA0;
    --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono:ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size:16px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#fff; color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  button, input, textarea, select{ font:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  /* each new screen moves focus to its heading so screen readers announce it; a heading isn't a control, so no ring */
  [tabindex="-1"]:focus{ outline:none; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; scroll-behavior:auto !important; } }

  .wrap{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:10px 8px 14px; }
  .switch{ display:flex; font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  .switch button{ background:#fff; border:1.5px solid var(--ink); padding:10px 12px; margin-left:-1.5px; min-height:40px; }
  .switch button[aria-pressed="true"]{ background:var(--ink); color:#fff; }
  .switch .restart{ margin-left:10px; border-color:var(--line); color:var(--dim); }
  /* a way back to the portfolio: this opens in a new tab, so the browser's back button won't do it */
  .back-home{ font-family:var(--mono); font-size:13px; color:var(--ink); text-decoration:underline; text-underline-offset:3px; padding:8px 4px; }
  .caption{ font-family:var(--mono); font-size:12px; color:var(--dim); text-align:center; max-width:360px; line-height:1.5; margin:0; }

  /* the phone */
  .phone{ width:360px; max-width:100%; aspect-ratio:9/18.5; border:2px solid #C8C8C8; border-radius:34px; padding:14px 10px 18px; background:#F4F4F4; position:relative; }
  .phone::before{ content:""; position:absolute; top:6px; left:50%; width:44px; height:4px; margin-left:-22px; border-radius:3px; background:#C8C8C8; }
  .screen{ position:relative; width:100%; height:100%; background:#fff; border:1px solid #D4D4D4; overflow:hidden; display:flex; flex-direction:column; }
  .body{ flex:1; overflow-y:auto; overflow-x:hidden; overflow-wrap:break-word; padding:0 16px 16px; display:flex; flex-direction:column; }
  .body.center{ justify-content:center; align-items:center; text-align:center; }
  .push{ margin-top:auto; }

  /* top bar */
  .bar{ display:grid; grid-template-columns:44px 1fr 44px; align-items:center; padding:10px 8px 6px; min-height:58px; }
  .bar h1{ font-size:1.13rem; font-weight:500; margin:0; line-height:1.2; text-align:center; }
  .bar h1.left{ text-align:left; grid-column:1 / 3; padding-left:8px; }
  .bar h1 small{ display:block; font-size:.9rem; font-weight:400; color:var(--dim); margin-top:2px; }
  .pill{ justify-self:center; padding:4px 16px; border-radius:20px; font-size:.95rem; font-weight:500; margin:0; }
  .icon-btn{ width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:none; border:0; border-radius:10px; padding:0; font-size:1.6rem; line-height:1; }
  .burger::before{ content:""; width:22px; height:2.5px; background:currentColor; box-shadow:0 -7px 0 currentColor, 0 7px 0 currentColor; }

  /* buttons */
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:46px; border:1.5px solid var(--ink); background:#fff; border-radius:12px; padding:10px 14px; font-size:1rem; margin:6px 0; text-align:center; line-height:1.25; }
  .btn.round{ border-radius:24px; }
  .btn.solid{ background:var(--ink); color:#fff; }
  .btn.green{ background:var(--green); border-color:var(--green-d); }
  .btn.mint{ background:var(--mint); border-color:#7ED9A2; }
  .btn.lilac{ background:var(--lilac); border-color:#B9AEF0; }
  .btn.pinkb{ background:var(--pink); border-color:#EBA3A3; }
  .btn.ghost{ border-color:var(--line); }
  .btn.small{ display:inline-flex; width:auto; min-height:40px; padding:8px 14px; font-size:.9rem; margin:3px 2px; }
  .btn small{ display:block; font-size:.85rem; color:var(--dim); }
  .btn:has(small){ flex-direction:column; gap:2px; }
  .btn:active{ transform:translateY(1px); }
  .btn[disabled]{ opacity:.45; cursor:default; }
  .row{ display:flex; gap:8px; } .row > *{ flex:1; }
  .muted{ color:var(--dim); font-size:.9rem; line-height:1.45; }
  .note-text{ font-size:.9rem; line-height:1.45; }
  h2{ font-size:1rem; font-weight:600; margin:14px 0 6px; }
  p{ line-height:1.45; }

  /* colour screens */
  .s-blue .screen{ background:var(--blue); color:#fff; }
  .s-green .screen{ background:var(--green); }
  .s-mint .screen{ background:var(--mint); }
  .s-yellow .screen{ background:repeating-linear-gradient(115deg, #FFE14D 0 40px, #FFEA80 40px 80px); }
  .s-pink .screen{ background:var(--pink); }
  .s-dark .screen{ background:#161616; color:#fff; }
  .s-dark .muted{ color:#C9C9C9; }

  /* lock + sign in */
  .lock{ flex:1; display:flex; flex-direction:column; align-items:center; padding-top:44px; position:relative; }
  .clock{ font-size:4rem; font-weight:200; }
  .date{ font-size:.95rem; margin-top:2px; }
  .notif{ margin-top:30px; width:88%; background:rgba(255,255,255,.94); color:var(--ink); border:0; border-radius:16px; padding:12px 14px; font-size:.95rem; text-align:left; line-height:1.4; }
  .notif b{ display:block; font-size:.82rem; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin-bottom:4px; }
  .hint{ margin-top:14px; font-size:.82rem; font-family:var(--mono); letter-spacing:.06em; color:#fff; }
  .cross{ position:absolute; bottom:0; left:50%; width:150px; height:150px; margin-left:-75px; }
  .cross::before,.cross::after{ content:""; position:absolute; background:#fff; }
  .cross::before{ left:50px; right:50px; top:0; bottom:0; } .cross::after{ top:44px; bottom:56px; left:0; right:0; }
  .s-blue .btn{ border-color:#fff; background:#fff; color:var(--ink); }
  .s-blue .btn.outline{ background:transparent; color:#fff; }
  label.f{ display:block; font-size:.9rem; font-weight:600; margin:14px 0 6px; }
  .s-blue label.f{ color:#fff; }
  .field{ width:100%; min-height:46px; border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:10px 12px; font-size:1rem; }
  textarea.field{ min-height:110px; resize:vertical; }
  .field::placeholder{ color:#6E6D66; }

  /* tasks */
  .task{ display:flex; align-items:center; gap:12px; width:100%; min-height:52px; background:none; border:0; text-align:left; padding:8px; margin:2px 0; border-radius:12px; font-size:1rem; line-height:1.3; }
  .ring{ flex:0 0 28px; height:28px; border:2.5px solid var(--ink); border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; }
  .task[aria-checked="true"], .task[aria-disabled="true"]{ background:var(--green); }
  .task[aria-checked="true"] .t, .task[aria-disabled="true"] .t{ text-decoration:line-through; }
  .task[aria-checked="true"] .muted, .task[aria-disabled="true"] .muted{ color:var(--ink); }
  .task.cta{ background:#D9D9D6; }
  .task .go{ margin-left:auto; flex:0 0 auto; font-size:.85rem; white-space:nowrap; }
  .stats{ display:flex; gap:8px; margin:6px 0 10px; }
  .stat{ flex:1; border:1.5px solid var(--ink); border-radius:12px; padding:8px; text-align:center; }
  .stat b{ display:block; font-size:1.25rem; } .stat span{ font-size:.82rem; color:var(--dim); }

  /* menu */
  .menu .item{ display:flex; align-items:center; justify-content:space-between; width:100%; min-height:48px; text-align:left; background:none; border:0; border-bottom:1px solid var(--soft); font-size:1.15rem; padding:6px 4px; }
  .menu .item::after{ content:"›"; color:var(--dim); }
  .menu .switch-app{ border:1.5px solid var(--blue); color:var(--blue); border-radius:12px; margin-top:14px; font-size:1rem; justify-content:center; }
  .menu .switch-app::after{ content:""; }

  /* rewards */
  .big svg{ width:120px; height:120px; }
  .reward{ font-size:1.2rem; font-weight:700; line-height:1.3; margin:10px 0 0; }
  .pts{ display:inline-block; background:var(--ink); color:#fff; border-radius:20px; padding:4px 12px; font-weight:700; margin-top:8px; }

  /* cards, lists, tables */
  .card{ width:100%; border:1.5px solid var(--ink); border-radius:14px; padding:12px; margin:6px 0; background:#fff; }
  .card h2{ margin-top:0; }
  .yl{ display:block; width:100%; min-height:52px; border:1.5px solid var(--ink); border-radius:16px; background:#fff; padding:12px; margin:8px 0; font-size:1.05rem; text-align:center; }
  .award{ display:flex; gap:12px; align-items:center; padding:8px 0; text-align:left; border-bottom:1px solid rgba(0,0,0,.12); }
  .award svg{ flex:0 0 38px; height:38px; }
  .award span{ font-size:1rem; line-height:1.3; } .award small{ display:block; font-size:.85rem; }
  table.lb{ width:100%; border-collapse:collapse; font-size:.92rem; }
  table.lb caption{ text-align:left; font-weight:600; padding:0 0 6px; font-size:1rem; }
  table.lb th{ text-align:left; font-size:.82rem; font-weight:600; color:var(--dim); border-bottom:1.5px solid var(--ink); padding:4px 2px; }
  table.lb td{ padding:7px 2px; border-bottom:1px solid var(--line); }
  table.lb td.n, table.lb th.n{ text-align:right; }
  table.lb tr.me td{ background:var(--mint); font-weight:600; }
  .rank{ display:inline-flex; width:26px; height:26px; border-radius:50%; align-items:center; justify-content:center; font-size:.82rem; font-weight:700; background:var(--soft); }
  .rank.r1{ background:#E8B923; } .rank.r2{ background:#C7CCD1; } .rank.r3{ background:#D99A62; }
  .feed{ display:flex; gap:10px; align-items:center; border-radius:12px; padding:10px; margin:6px 0; font-size:.9rem; line-height:1.35; text-align:left; border:1.5px solid var(--ink); }
  .feed .when{ display:block; font-size:.82rem; color:var(--dim); }
  .cheer{ flex:0 0 auto; min-width:52px; min-height:40px; border:1.5px solid var(--ink); border-radius:20px; background:#fff; font-size:.85rem; }
  .cheer[aria-pressed="true"]{ background:var(--ink); color:#fff; }
  .patient{ display:flex; align-items:center; gap:10px; width:100%; min-height:56px; border:1.5px solid transparent; border-radius:14px; padding:8px 10px; margin:5px 0; text-align:left; background:var(--blue-l); font-size:.9rem; }
  .patient .nm{ font-weight:600; font-size:.95rem; overflow-wrap:anywhere; }
  .patient > span:not(.st){ min-width:0; }
  .msg, .chip b{ overflow-wrap:anywhere; min-width:0; }
  .stat b, table.lb th{ white-space:nowrap; }
  .patient .meta{ display:block; color:var(--ink); font-size:.85rem; }
  .patient .st{ margin-left:auto; font-size:.82rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:4px 8px; border-radius:8px; background:rgba(255,255,255,.7); white-space:nowrap; text-align:center; line-height:1.25; }
  .patient.urgent{ background:var(--red); } .patient.soon{ background:var(--orange); } .patient.complete{ background:var(--mint); }
  .chip{ display:flex; align-items:center; gap:10px; background:var(--blue-l); border-radius:14px; padding:8px 12px; font-size:.9rem; margin-bottom:10px; }
  .chip b{ flex:1; }

  /* questions */
  fieldset{ border:0; margin:0; padding:0; }
  legend{ font-size:1rem; font-weight:600; line-height:1.35; margin:6px 0 8px; padding:0; }
  .opt{ display:flex; gap:10px; align-items:flex-start; width:100%; min-height:44px; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:10px; margin:5px 0; font-size:.95rem; line-height:1.35; }
  .opt .box{ flex:0 0 20px; height:20px; border:2px solid var(--ink); border-radius:50%; margin-top:1px; }
  .opt[aria-checked="true"]{ border-color:var(--green-d); background:var(--mint); }
  .opt[aria-checked="true"] .box{ background:var(--green-d); box-shadow:inset 0 0 0 3px #fff; }
  .progress{ height:10px; background:#E3E3E0; border-radius:6px; overflow:hidden; margin:10px 0 4px; }
  .progress i{ display:block; height:100%; background:var(--green-d); }
  .s-dark .progress{ background:#3A3A3A; } .s-dark .progress i{ background:var(--green); }
  .abcd{ display:flex; gap:12px; align-items:center; width:100%; min-height:48px; background:#fff; border:1.5px solid var(--line); border-radius:12px; text-align:left; font-size:.95rem; padding:8px 10px; margin:5px 0; }
  .abcd .l{ flex:0 0 30px; height:30px; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; font-weight:700; }
  .abcd.right{ border-color:var(--green-d); background:var(--mint); } .abcd.right .l{ background:var(--green-d); color:#fff; }
  .abcd.wrong{ border-color:var(--red-d); background:#FDE3E3; } .abcd.wrong .l{ background:var(--red-d); color:#fff; }
  .verdict{ font-weight:700; margin:8px 0 2px; }
  .scenario-q{ background:#111; color:#fff; padding:12px; font-size:1.02rem; line-height:1.4; border-radius:6px; margin:4px 0 14px; }
  .pager{ display:flex; align-items:center; justify-content:space-between; padding-top:10px; }
  .pager span{ font-size:1rem; }
  input[type=range]{ width:100%; height:44px; accent-color:var(--blue); }

  /* coach */
  .bubble{ background:#fff; border:1.5px solid var(--ink); border-radius:16px; padding:12px 14px; font-size:.92rem; line-height:1.5; text-align:left; }
  .bubble p{ margin:0 0 8px; } .bubble p:last-child{ margin:0; }
  .chat{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:6px 0; }
  .msg{ max-width:86%; border-radius:16px; padding:9px 12px; font-size:.92rem; line-height:1.45; }
  .msg.me{ align-self:flex-end; background:var(--blue-l); border-bottom-right-radius:4px; }
  .msg.them{ align-self:flex-start; background:var(--soft); border-bottom-left-radius:4px; }
  .rundown{ display:flex; gap:12px; align-items:center; width:100%; min-height:56px; border:1.5px solid var(--ink); border-radius:12px; padding:8px 10px; margin:5px 0; text-align:left; background:#fff; font-size:.92rem; }
  .rundown .face{ flex:0 0 36px; height:36px; border-radius:50%; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; font-weight:700; }
  .rundown small{ display:block; color:var(--dim); font-size:.85rem; }

  /* charts: numbers are always printed, so nothing depends on reading bar heights */
  .chart{ width:100%; margin:6px 0 4px; }
  .bars{ display:flex; align-items:flex-end; gap:8px; height:130px; border-bottom:2px solid var(--ink); padding:0 4px; }
  .bars .b{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; }
  .bars .b i{ display:block; width:100%; background:var(--blue); border-radius:4px 4px 0 0; }
  .bars .b.hi i{ background:var(--ink); }
  .bars .b em{ font-style:normal; font-size:.85rem; font-weight:700; margin-bottom:3px; }
  .xl{ display:flex; gap:8px; padding:4px 4px 0; } .xl span{ flex:1; text-align:center; font-size:.82rem; color:var(--dim); }
  .s-dark .bars{ border-color:#fff; } .s-dark .bars .b i{ background:var(--green); }
  .heat{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:6px 0; }
  .heat div{ border-radius:8px; padding:8px 6px; text-align:center; font-size:.82rem; line-height:1.25; border:1.5px solid var(--ink); }
  .heat b{ display:block; font-size:1.15rem; }
  .h0{ background:#fff; } .h1{ background:#FDE3C5; } .h2{ background:var(--orange); } .h3{ background:var(--red); }
  .legend{ display:flex; gap:10px; flex-wrap:wrap; font-size:.82rem; color:var(--dim); }
  .legend i{ display:inline-block; width:12px; height:12px; border:1px solid var(--ink); border-radius:3px; vertical-align:-2px; margin-right:4px; }

  /* hazard spotting */
  .scene{ position:relative; width:100%; aspect-ratio:4/3; border:1.5px solid var(--ink); border-radius:10px; overflow:hidden; background:#EEF3F8; }
  .scene svg{ position:absolute; inset:0; width:100%; height:100%; }
  .hz{ position:absolute; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; border:2px dashed transparent; background:transparent; }
  .hz:hover, .hz:focus-visible{ border-color:var(--focus); }
  .hz[aria-pressed="true"]{ border:3px solid var(--green-d); background:rgba(47,201,90,.25); }

  .toast{ position:absolute; left:12px; right:12px; bottom:14px; background:var(--ink); color:#fff; border-radius:12px; padding:12px; font-size:.92rem; text-align:center; opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none; z-index:5; }
  .toast.on{ opacity:1; transform:none; }
  .swatches{ display:flex; gap:8px; margin:4px 0 12px; flex-wrap:wrap; }
  .swatches button{ width:44px; height:44px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1.5px var(--line); }
  .swatches button[aria-pressed="true"]{ box-shadow:0 0 0 3px var(--ink); }
  .toggle{ display:flex; align-items:center; justify-content:space-between; width:100%; min-height:52px; background:none; border:0; border-bottom:1px solid var(--soft); font-size:1rem; padding:6px 2px; text-align:left; }
  .toggle .sw{ flex:0 0 48px; height:28px; border-radius:14px; background:#BDBDB8; position:relative; }
  .toggle .sw::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.2s; }
  .toggle[aria-checked="true"] .sw{ background:var(--green-d); }
  .toggle[aria-checked="true"] .sw::after{ left:23px; }
  .seg{ display:flex; gap:6px; margin:6px 0 10px; } .seg button{ flex:1; min-height:44px; border:1.5px solid var(--ink); background:#fff; border-radius:10px; }
  .seg button[aria-pressed="true"]{ background:var(--ink); color:#fff; }
  .step-dots{ display:flex; gap:6px; justify-content:center; margin:8px 0; } .step-dots i{ width:8px; height:8px; border-radius:50%; background:var(--line); } .step-dots i.on{ background:var(--ink); }

  /* settings: high contrast */
  .hc .screen{ --dim:#16150F; --line:#16150F; }
  .hc .s-blue .screen, .hc.s-blue .screen{ background:#1A3A8A; }
  @media (max-width:400px){ .phone{ border-radius:26px; padding:12px 6px 14px; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-home" href="../#safesteps">← back to robfawley.com</a>
  <div class="switch" role="group" aria-label="Choose which app to try">
    <button type="button" data-app="staff" aria-pressed="true">Staff app</button>
    <button type="button" data-app="manager" aria-pressed="false">Manager app</button>
    <button type="button" class="restart" data-act="restart">Restart</button>
  </div>
  <div class="phone" id="phone" role="region" aria-label="Phone screen">
    <div class="screen" id="screen"></div>
  </div>
  <div id="live" class="sr" role="status" aria-live="polite"></div>
  <p class="caption">Tap through it like a phone. All names and figures are made up.</p>
</div>

<script>
(function(){
  /* ---------- drawings (decorative unless labelled) ---------- */
  const sv = (vb, inner, label) => `<svg viewBox="${vb}" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'} focusable="false">${inner}</svg>`;
  const I = {
    flame: l=>sv('0 0 100 100','<path d="M50 8c4 18-14 26-14 46 0 12 8 22 20 22-6-6-4-16 4-24 2 10 12 12 12 24 0 8-6 14-12 16 20-2 30-16 30-32 0-26-24-34-40-52z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>',l),
    thumb: l=>sv('0 0 100 100','<rect x="10" y="44" width="16" height="44" fill="#16150F"/><path d="M32 46l18-34c8 0 12 6 10 14l-4 16h26c6 0 9 5 8 10l-6 30c-1 4-4 6-8 6H32z" fill="#16150F"/>',l),
    shield: l=>sv('0 0 100 100','<path d="M50 8l34 12v26c0 22-14 38-34 46C30 84 16 68 16 46V20z" fill="#16150F"/><path d="M50 20l24 8v18c0 16-10 28-24 34-14-6-24-18-24-34V28z" fill="#2FC95A"/><path d="M50 32v34M33 49h34" stroke="#16150F" stroke-width="8"/>',l),
    trophy: l=>sv('0 0 100 100','<path d="M28 12h44v20c0 16-10 26-22 26S28 48 28 32zM28 20H12c0 14 8 22 18 22M72 20h16c0 14-8 22-18 22M50 58v16M32 88h36v-8H32z" fill="none" stroke="#16150F" stroke-width="7" stroke-linejoin="round"/>',l),

      <fieldset><legend id="lw">Did you see it happen?</legend>${radio('lw',['Yes, I saw it','No, I found them'], S.log.w, 'logw')}</fieldset>
      <button class="btn solid round push" data-act="log1next">Continue</button></div>`},
    log2:{title:'Log a fall, step 2 of 2', html:()=>`${bar('Log a fall')}<div class="body"><p class="muted" style="margin:0 0 6px">Step 2 of 2</p>${chip(S.patients[S.log.p||0])}
      <fieldset><legend id="li">Is the patient hurt?</legend>${radio('li',['No visible injury','Minor injury, such as a bruise or graze','Possible serious injury: I need help now'], S.log.inj, 'loginj')}</fieldset>
      <fieldset><legend id="lwh">Where did it happen?</legend>${radio('lwh',['By the bed','In the bathroom or toilet','On the ward corridor'], S.log.where, 'logwhere')}</fieldset>
      <button class="btn solid round push" data-act="log2next">Log the fall</button></div>`},
    logged:{cls:'s-green', title:'Fall logged', html:()=>`${plain()}<div class="body center"><div class="big">${I.thumb()}</div>
      <p class="reward">Fall logged. Thank you.</p><span class="pts">+20 points</span><p>For you and the ward. The nurse in charge has been told.</p><button class="btn round" style="width:80%;margin-top:14px" data-go="badge">Continue</button></div>`},
    badge:{cls:'s-green', title:'Badge unlocked', html:()=>`${plain()}<div class="body center"><div class="big">${I.shield()}</div>
      <p class="reward">Badge unlocked: Fall Guardian</p><p>For helping to prevent 25 falls on your ward.</p>
      <button class="btn round" style="width:85%;margin-top:14px" data-go="debrief">Start the post-fall debrief</button><button class="btn round" style="width:85%;background:transparent" data-act="home">Back to my tasks</button></div>`},

    /* post-fall debrief, after the National Audit of Inpatient Falls questions */
    debrief:{title:'Post-fall debrief', html:()=>{ const D=DEBRIEF[S.debrief.i]; return `${bar('Post-fall debrief')}<div class="body">${chip(S.patients[0])}
      <div class="progress" role="progressbar" aria-label="Debrief progress" aria-valuemin="1" aria-valuemax="${DEBRIEF.length}" aria-valuenow="${S.debrief.i+1}"><i style="width:${(S.debrief.i+1)/DEBRIEF.length*100}%"></i></div>
      <p class="muted" style="margin:0 0 4px">Question ${S.debrief.i+1} of ${DEBRIEF.length}</p>
      <fieldset><legend id="dq">${D.q}</legend>${radio('dq', D.o, S.debrief.a[S.debrief.i], 'dbopt')}</fieldset>
      <div class="row push" style="padding-top:8px">${S.debrief.i?'<button class="btn round" data-act="dbprev">Back</button>':''}<button class="btn solid round" data-act="dbnext">${S.debrief.i<DEBRIEF.length-1?'Continue':'Submit'}</button></div></div>`}},
    debriefdone:{cls:'s-mint', title:'Fall report complete', html:()=>`${plain()}<div class="body center"><div class="big">${I.thumb()}</div><p class="reward">Fall report complete</p><p>Sent to Victoria, the ward manager, for the post-fall huddle.</p><button class="btn round" style="width:80%" data-act="home">Back to my tasks</button></div>`},

    /* achievements */
    hub:{cls:'s-yellow', title:'Achievement hub', html:()=>`${bar('Achievement hub')}<div class="body center">
      <button class="yl" data-go="trophies">Trophy cabinet</button><button class="yl" data-go="analytics">Personal analytics</button><button class="yl" data-go="community">Community hub</button></div>`},
    trophies:{cls:'s-yellow', title:'Trophy cabinet', html:()=>`${bar('Trophy cabinet')}<div class="body"><div class="card" style="text-align:center">${avatar(S.avatar.skin,S.avatar.hair,64)}<p style="margin:6px 0 0;font-weight:600">Alan Smith</p><p class="muted" style="margin:0">Healthcare assistant · Ward 8, Arrowe Park</p></div>
      <div class="card"><div class="award">${I.trophy()}<span>Weekly national fall prevention champion<small>Won 3 times</small></span></div><div class="award">${I.medal()}<span>Hospital fall prevention champ<small>Won 10 times</small></span></div>
      <div class="award">${I.badge()}<span>Ward fall prevention champ<small>Won 28 times</small></span></div><div class="award">${I.shield()}<span>Fall Guardian<small>Helped prevent 25 falls</small></span></div>
      <div class="award" style="border:0">${I.check()}<span>Fall Safety Legend<small>412 of 1,000 actions · 41%</small></span></div></div></div>`},
    community:{cls:'s-yellow', title:'Community hub', html:()=>`${bar('Community hub')}<div class="body center">
      <button class="yl" data-go="board">Achievement board</button><button class="yl" data-go="hospitalLB">Hospital leader board</button><button class="yl" data-go="nationalLB">National leader board</button></div>`},
    board:{title:'Achievement board', html:()=>`${bar('Achievement board')}<div class="body"><div role="list">
      ${[['#BDF2D1','Marcus Delgado earned the Safety Shield for helping prevent 25 falls.','10 min ago'],['#FFF3B0','Emma Thomas reached Fall Safety Legend: 1,000 fall-preventing actions.','1 hour ago'],['#F2E3C2','Stuart Birch came 3rd nationally for daily fall prevention actions.','Today'],['#BDF2D1','Ward 10 completed this month’s mission: falls down 15%.','Yesterday'],['#FFF3B0','Claire Stephens finished 30 daily quizzes in a row.','Yesterday']].map(([c,t,w],k)=>`<div class="feed" role="listitem" style="background:${c}">${face(k+2,34)}<span style="flex:1">${t}<span class="when">${w}</span></span><button class="cheer" aria-pressed="false" data-act="cheer" aria-label="Cheer: ${t}">Cheer</button></div>`).join('')}</div></div>`},
    hospitalLB:{cls:'s-yellow', title:'Hospital leader board', html:()=>`${bar('Hospital leader board')}<div class="body"><div class="card">
      <table class="lb"><caption>Wards this week</caption><thead><tr><th>Rank</th><th>Ward</th><th class="n">Points</th></tr></thead><tbody>
      ${[['Geriatrics',1750],['A&amp;E',1200],['Ward 8 (yours)',1015],['Cancer Ward 2',870],['Ward 10',820]].map(([w,p],i)=>`<tr class="${i===2?'me':''}"><td><span class="rank r${i+1}">${i+1}</span></td><td>${w}</td><td class="n">${p.toLocaleString('en-GB')}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><table class="lb"><caption>Top fall heroes</caption><thead><tr><th>Rank</th><th>Name</th><th class="n">Actions</th></tr></thead><tbody>
      ${[['Alan Jones',212],['Claire Stephens',198],['Alan Smith (you)',176],['Peter Downes',151]].map(([n,a],i)=>`<tr class="${i===2?'me':''}"><td><span class="rank r${i+1}">${i+1}</span></td><td>${n}</td><td class="n">${a}</td></tr>`).join('')}</tbody></table></div></div>`},
    nationalLB:{cls:'s-yellow', title:'National leader board', html:()=>`${bar('National leader board')}<div class="body"><div class="card">
      <table class="lb"><caption>Hospitals this month</caption><thead><tr><th>Rank</th><th>Hospital</th><th class="n">Points</th></tr></thead><tbody>
      ${[['Arrowe Park (yours)',28280],['Kings Hospital',25670],['Manchester Royal',25330],['St George’s',24910],['Leeds General',23480]].map(([w,p],i)=>`<tr class="${i===0?'me':''}"><td><span class="rank r${i+1}">${i+1}</span></td><td>${w}</td><td class="n">${p.toLocaleString('en-GB')}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><table class="lb"><caption>Biggest improvers</caption><thead><tr><th>Hospital</th><th class="n">Falls</th></tr></thead><tbody><tr><td>Leeds General</td><td class="n">−22%</td></tr><tr><td>Arrowe Park</td><td class="n">−18%</td></tr><tr><td>St Thomas’</td><td class="n">−15%</td></tr></tbody></table></div></div>`},
    analytics:{cls:'s-yellow', title:'Personal analytics', html:()=>`${bar('Personal analytics')}<div class="body"><div class="card">
      <h2>Fall-preventing actions</h2><p class="muted" style="margin:0">Each quarter of 2025</p>
      ${barsChart([62,84,121,176],['Q1','Q2','Q3','Q4'],'Bar chart of your fall-preventing actions: 62 in Q1, 84 in Q2, 121 in Q3 and 176 in Q4.',{hi:3})}
      <p class="note-text" style="margin:8px 0 0">Up 45% on last quarter. That’s lifted you to 3rd on your ward this week.</p></div>
      <div class="card"><h2>Where your actions went</h2><table class="lb"><tbody><tr><td>Toileting rounds</td><td class="n">71</td></tr><tr><td>Call bell checks</td><td class="n">48</td></tr><tr><td>Footwear checks</td><td class="n">32</td></tr><tr><td>Falls logged</td><td class="n">25</td></tr></tbody></table></div></div>`},
    mission:{cls:'s-dark', title:'Mission HQ', html:()=>`<header class="bar"><button class="icon-btn" data-act="back" aria-label="Back" style="color:#fff">‹</button><h1 id="h" style="font-size:1.6rem;font-weight:900;font-style:italic;color:#FFE14D">MISSION HQ</h1><button class="icon-btn burger" data-go="menu" aria-label="Open menu" style="color:#fff"></button></header><div class="body">
      ${[['Ward mission · November','Cut falls on the ward by 15%','Down 9% so far, 60% of the way there',60,'+10,000'],['Ward mission · this week','75% daily task completion across the ward','81% completed, target beaten',100,'+1,500'],['Your mission · today','Complete a frailty quiz','Not started',0,'+90']].map(([k,t,s,p,b],i)=>`<section style="padding:10px 0;border-bottom:1px solid #333"><p class="muted" style="margin:0;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em">${k}</p><p style="margin:4px 0;font-size:1.05rem">${t}</p>
        <div class="progress" role="progressbar" aria-label="${t}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><i style="width:${p}%"></i></div><p class="muted" style="margin:2px 0 0">${s}</p><p class="muted" style="margin:0">Bonus ${b} points${p>=100?' · earned':''}</p>${i===2?'<button class="btn round" style="margin-top:10px;background:#fff;color:#111" data-act="toquiz">Start the frailty quiz</button>':''}</section>`).join('')}</div>`},
    summary:{title:'Safe Steps summary', html:()=>{ const slides=[
        `<div class="big">${I.cal()}</div><p style="font-size:1.1rem">The year’s nearly over, so here’s everything you’ve done to reduce falls in 2025.</p>`,
        `<div style="background:var(--green);border-radius:16px;padding:18px;width:100%"><div class="big">${I.mask()}</div><p style="font-size:1.1rem;margin:0">You were a real fall hero: <b>443 fall-preventing actions</b>, and top of your ward’s board for 6 weeks.</p></div>`,
        `<div class="card" style="text-align:left"><table class="lb"><caption>Your 2025 in numbers</caption><tbody><tr><td>Daily quizzes</td><td class="n">214</td></tr><tr><td>Scenario run-throughs</td><td class="n">31</td></tr><tr><td>Falls logged</td><td class="n">25</td></tr><tr><td>Ward 8 falls vs 2024</td><td class="n">−18%</td></tr></tbody></table></div><button class="btn round solid" style="width:85%" data-act="home">Back to my tasks</button>`];
      return `${bar('Safe Steps summary')}<div class="body center">${slides[S.sum]}<div class="pager" style="width:100%;margin-top:auto"><button class="icon-btn" data-act="sum" data-d="-1" ${S.sum===0?'disabled':''} aria-label="Previous slide">‹</button><span>${S.sum+1} of ${slides.length}</span><button class="icon-btn" data-act="sum" data-d="1" ${S.sum===slides.length-1?'disabled':''} aria-label="Next slide">›</button></div></div>`}},

    /* training */
    training:{title:'Training hub', html:()=>`${bar('Training hub')}<div class="body" style="justify-content:center">
      <button class="btn mint round" data-go="coachhome">Coach<small>Tips, pep talks and chat</small></button><button class="btn lilac round" data-go="sims">Simulations<small>Scenarios and hazard spotting</small></button><button class="btn pinkb round" data-go="quizzes">Quizzes<small>Daily quiz and specialist quizzes</small></button>
      <div style="text-align:center;margin-top:12px">${coach(110)}</div></div>`},
    coachhome:{title:'Coach', html:()=>`${pillbar('Coach','var(--mint)')}<div class="body" style="align-items:center">
      <p class="note-text" style="text-align:center;margin-top:0">Your fall-prevention expert, with advice drawn from NICE guidance and your ward’s own data.</p>
      <button class="btn mint round" data-go="tips">Coach tips</button><button class="btn mint round" data-go="chat">Coach chat</button><button class="btn mint round" data-go="pep">Pep talk</button><button class="btn mint round" data-go="rundowns">Previous scenario rundowns</button>
      <div class="push">${coach(120)}</div></div>`},
    tips:{title:'Coach tips', html:()=>`${pillbar('Coach tips','var(--mint)')}<div class="body"><div class="bubble"><p><b>Your ward, last 3 months</b></p><p>Most falls happen on unsupervised trips to the bathroom, and 28% happen near the bed because of clutter.</p><p><b>Try this week:</b> a toileting round early in the morning and after meals, and a twice-daily “clear floor” check around each bed.</p><p>Both count towards your ward mission.</p></div><div class="push" style="text-align:center;padding-top:10px">${coach(100)}</div></div>`},
    pep:{title:'Pep talk', html:()=>`${pillbar('Pep talk','var(--mint)')}<div class="body"><div class="bubble"><p>You’re with patients more than anyone, and you notice the little things others miss: someone looking unsteady, slippers left off, a patient trying to get up alone.</p><p>When you step in, checking the call bell or walking them to the toilet, you’re not just doing a task. You might be saving their independence.</p><p>Trust your instincts. Every safe step is a win for the patient and the team.</p></div><div class="push" style="text-align:center;padding-top:10px">${coach(100)}</div></div>`},
    chat:{title:'Coach chat', html:()=>`${pillbar('Coach chat','var(--mint)')}<div class="body"><div class="chat" id="chat" role="log" aria-label="Conversation with the coach">${(S.chatlog||[{w:'them',t:'Hi Alan, how can I help today?'}]).map(m=>`<div class="msg ${m.w}"><span class="sr">${m.w==='me'?'You':'Coach'}: </span>${esc(m.t)}</div>`).join('')}</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0">${Object.keys(CHAT).map(q=>`<button class="btn small" data-act="ask" data-q="${q}">${q}</button>`).join('')}</div>
      <form class="row" data-form="chat" style="align-items:center"><label class="sr" for="chatin">Message the coach</label><input class="field" id="chatin" placeholder="Type a question…" autocomplete="off"><button class="btn solid" style="flex:0 0 auto;width:auto" type="submit">Send</button></form></div>`},
    rundowns:{title:'Previous scenario rundowns', html:()=>`${pillbar('Rundowns','var(--mint)')}<div class="body"><p class="muted" style="margin-top:0">Your last five scenarios, with the coach’s rating.</p>
      ${[['★','#FFE14D','Taking a patient to the toilet','Outstanding'],['!','#F9C9C9','Completing a frailty assessment','Needs improvement'],['~','#F5D6A8','Acting as a patient porter','Mixed'],['✓','#BDF2D1','Answering a call bell at night','Good'],['✓','#BDF2D1','Taking a patient to theatre','Good']].map(([f,c,t,r])=>`<button class="rundown" data-act="toast" data-t="${t}: rated ${r.toLowerCase()}."><span class="face" style="background:${c}" aria-hidden="true">${f}</span><span>${t}<small>Coach rating: ${r}</small></span></button>`).join('')}</div>`},
    sims:{title:'Simulations', html:()=>`${pillbar('Simulations','var(--lilac)')}<div class="body" style="justify-content:center">
      <button class="btn lilac round" data-act="scenstart">Scenario run-through<small>3 decisions · +25 points</small></button>
      <button class="btn lilac round" data-act="hzstart">Hazard spotting<small>Find 4 risks in the bay · up to +40</small></button>
      <button class="btn lilac round" data-go="rundowns">Previous rundowns</button></div>`},
    hazard:{title:'Hazard spotting', html:()=>`${bar('Hazard spotting')}<div class="body"><p class="note-text" style="margin-top:0">Tap the four things in this bay that could cause a fall.</p>
      <div class="scene">${sv('0 0 400 300',`
        <rect x="0" y="0" width="400" height="190" fill="#E7EEF6"/><rect x="0" y="190" width="400" height="110" fill="#CFD8E2"/>
        <rect x="150" y="30" width="110" height="70" rx="4" fill="#fff" stroke="#16150F" stroke-width="3"/><path d="M205 30v70M150 65h110" stroke="#16150F" stroke-width="2"/>
        <rect x="120" y="140" width="180" height="60" rx="8" fill="#fff" stroke="#16150F" stroke-width="3"/><rect x="120" y="120" width="55" height="28" rx="8" fill="#BDF2D1" stroke="#16150F" stroke-width="3"/>
        <path d="M130 200v40M290 200v40" stroke="#16150F" stroke-width="5"/><rect x="290" y="105" width="10" height="100" fill="#16150F"/>
        <path d="M236 108c0 20-4 30-4 30" stroke="#16150F" stroke-width="2.5" fill="none"/><rect x="226" y="136" width="14" height="22" rx="4" fill="#F27272" stroke="#16150F" stroke-width="2.5"/>
        <ellipse cx="88" cy="236" rx="52" ry="12" fill="#9CC7F0" opacity=".8"/>
        <path d="M120 255c30-10 60 12 90 2s50-8 70 4" stroke="#16150F" stroke-width="3" fill="none"/><rect x="270" y="252" width="16" height="12" fill="#16150F"/>
        <rect x="320" y="170" width="60" height="60" rx="6" fill="#F5B36B" stroke="#16150F" stroke-width="3"/><rect x="320" y="140" width="12" height="60" fill="#F5B36B" stroke="#16150F" stroke-width="3"/>
        <path d="M325 222c6-6 18-6 22 0v6h-22zM350 222c6-6 18-6 22 0v6h-22z" fill="#7A1F2B" stroke="#16150F" stroke-width="2"/>`,'Illustration of a hospital bay with a bed, a chair, a window and the floor')}
        ${HAZ.map((h,i)=>`<button class="hz" style="left:${h.x}%;top:${h.y}%" aria-pressed="${S.hz.includes(i)}" data-act="hz" data-i="${i}" aria-label="${S.hz.includes(i)?'Found: ':'Possible hazard: '}${h.t}"></button>`).join('')}</div>
      <p class="muted">Found ${S.hz.length} of ${HAZ.length}</p><ul class="note-text" style="margin:0;padding-left:18px">${S.hz.map(i=>`<li>${HAZ[i].t}</li>`).join('')}</ul>
      <button class="btn solid round push" data-act="hzdone" ${S.hz.length<HAZ.length?'disabled':''}>${S.hz.length<HAZ.length?`Find ${HAZ.length-S.hz.length} more`:'Finish (+40 points)'}</button></div>`},
    scenario:{title:'Scenario', html:()=>{ const Q=SCEN[S.scen.i]; return `${bar('Scenario')}<div class="body"><p class="muted" style="margin:0 0 4px">Decision ${S.scen.i+1} of ${SCEN.length}</p><p class="scenario-q" id="sq">${Q.q}</p>
      <div role="group" aria-labelledby="sq">${Q.o.map((o,i)=>`<button class="btn round" data-act="scen" data-i="${i}">${o[0]}</button>`).join('')}</div></div>`}},
    scendone:{cls:'s-green', title:'Scenario complete', html:()=>`${plain()}<div class="body center"><div class="big">${I.check()}</div><p class="reward">Scenario complete</p><span class="pts">+25 points</span><p>One more scenario to earn your Scenario Pro badge.</p><button class="btn round" style="width:85%" data-go="report">Read the coach’s report</button></div>`},
    report:{title:'Coach’s report', html:()=>{ const good=S.scen.score===SCEN.length; return `${bar('Coach’s report')}<div class="body">
      <div style="display:flex;align-items:center;gap:10px;justify-content:center;font-size:1.25rem;font-weight:600"><span style="width:44px;display:block">${good?I.star():I.badge()}</span>${good?'Outstanding':'Good, with one to work on'}</div>
      <div class="bubble" style="margin-top:12px">${good
        ?'<p>You stayed with the patient, offered help without taking over, and kept them safe without taking away their dignity.</p><p>Next, build your confidence with mobility aids and think about longer-term factors like hydration and medication.</p>'
        :'<p>You kept the patient’s dignity in mind, which matters.</p><p>But with a frailty score of 7 and dementia, they shouldn’t walk to the toilet alone. Stay close, keep the call bell in reach, and flag them for an updated risk assessment.</p>'}</div>
      <p class="muted">You made the safest choice in ${S.scen.score} of ${SCEN.length} decisions.</p>
      <div style="display:flex;align-items:flex-end;gap:10px" class="push"><div>${coach(86)}</div><div style="flex:1"><button class="btn round" data-go="coachhome">Go to coach</button><button class="btn round solid" data-act="home">Back to my tasks</button></div></div></div>`}},
    quizzes:{cls:'s-pink', title:'Quizzes', html:()=>`${pillbar('Quizzes','#fff')}<div class="body">
      ${[['Daily quiz','4 questions · +5 each'],['Fall reporting quiz','Coming soon'],['Frailty assessment quiz','4 questions'],['Visual cues quiz','Coming soon']].map(([t,s],i)=>`<div class="card" style="padding:10px"><p style="margin:0;font-weight:600">${t}</p><p class="muted" style="margin:0 0 6px">${s}</p><button class="btn green round" style="margin:0" ${s==='Coming soon'?'disabled':'data-act="toquiz"'}>${s==='Coming soon'?'Coming soon':'Take quiz now'}</button></div>`).join('')}
      <button class="btn round" style="background:#fff" data-go="quizhist">Quiz history</button></div>`},
    quizhist:{cls:'s-pink', title:'Quiz history', html:()=>`${pillbar('Quiz history','#fff')}<div class="body"><div class="card"><table class="lb"><tbody><tr><td>Questions answered</td><td class="n">347</td></tr><tr><td>Answered correctly</td><td class="n">82%</td></tr><tr><td>Daily quizzes</td><td class="n">19</td></tr><tr><td>The Big One</td><td class="n">2 taken</td></tr></tbody></table></div>
      <div class="card"><h2>Last 5 daily quizzes</h2>${barsChart([3,4,2,4,4],['Mon','Tue','Wed','Thu','Fri'],'Bar chart of daily quiz scores out of 4: Monday 3, Tuesday 4, Wednesday 2, Thursday 4, Friday 4.',{unit:'/4'})}</div></div>`},
    quiz:{title:'Daily quiz', html:()=>{ const Q=QUIZ[S.quiz.i]; const p=S.quiz.picked; return `${pillbar('Daily quiz','var(--pink)')}<div class="body">
      <div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="1" aria-valuemax="${QUIZ.length}" aria-valuenow="${S.quiz.i+1}"><i style="width:${(S.quiz.i+1)/QUIZ.length*100}%"></i></div><p class="muted" style="margin:0">Question ${S.quiz.i+1} of ${QUIZ.length}</p>
      <p style="font-size:1.08rem;font-weight:600;line-height:1.35" id="qq">${Q.q}</p>
      <div role="group" aria-labelledby="qq">${Q.o.map((o,i)=>`<button class="abcd ${p!==null?(i===Q.a?'right':(i===p?'wrong':'')):''}" data-act="quiz" data-i="${i}" ${p!==null?'aria-disabled="true"':''}><span class="l" aria-hidden="true">${'ABCD'[i]}</span><span>${o}${p!==null&&i===Q.a?'<span class="sr"> (correct answer)</span>':''}</span></button>`).join('')}</div>
      ${p!==null?`<p class="verdict" style="color:${p===Q.a?'var(--green-d)':'var(--red-d)'}">${p===Q.a?'Correct':'Not quite'}</p><p class="note-text" style="margin:0">${Q.why}</p><button class="btn solid round push" data-act="quiznext">${S.quiz.i<QUIZ.length-1?'Next question':'See my score'}</button>`:''}</div>`}},

  const MANAGER = {

      <button class="item" data-act="home">Ward analytics</button><button class="item" data-go="patients">Patients</button><button class="item" data-act="toassign">Assign a task</button><button class="item" data-go="team">Our team</button>

    patients:{title:'Patients', html:()=>{ const list=S.patients.map((p,i)=>[p,i]).filter(([p])=>p.n.toLowerCase().includes(S.q.toLowerCase())); return `${bar('Patients')}<div class="body">
      <label class="sr" for="ps">Search patients</label><input class="field" id="ps" type="search" placeholder="Search patients" value="${esc(S.q)}" autocomplete="off">

      ${list.map(([p,i])=>`<div role="listitem"><button class="patient ${p.st}" data-act="patient" data-i="${i}">${face(p.bed,30)}<span><span class="nm">${esc(p.n)}, ${p.age}</span><span class="meta">Bed ${p.bed} · CFS ${p.cfs}</span></span><span class="st">MFRA<br>${p.st==='urgent'?'urgent':p.st==='soon'?'due soon':'done'}</span></button></div>`).join('')||'<p class="muted">No patients match.</p>'}</div>
      <button class="btn round" style="margin-top:8px" data-go="addpatient">+ Add a patient</button></div>`}},
    record:{title:'Patient record', html:()=>{ const p=S.patients[S.sel||0]; return `${bar(esc(p.n))}<div class="body">
      <div class="patient ${p.st}" style="cursor:default">${face(p.bed,34)}<span><span class="nm">${esc(p.n)}, ${p.age}</span><span class="meta">Bed ${p.bed} · CFS ${p.cfs}</span></span><span class="st">MFRA<br>${p.st==='urgent'?'overdue':p.st==='soon'?'due soon':'done'}</span></div>
      <table class="lb" style="margin:8px 0"><tbody><tr><td>Last MFRA</td><td class="n">${p.mfra}</td></tr><tr><td>Falls since admission</td><td class="n">${p.falls}</td></tr>${p.debrief?`<tr><td>Last debrief</td><td class="n">${p.debrief}</td></tr><tr><td>Last SWARM huddle</td><td class="n">${p.swarm}</td></tr>`:''}</tbody></table>
      <h2>Clinical Frailty Scale, by week</h2>${barsChart(p.cfsHist,['Wk 1','Wk 2','Wk 3','Wk 4'],`Clinical Frailty Scale over four weeks: ${p.cfsHist.join(', ')}.`,{hi:3})}

      <label class="f" for="np-x">NHS number</label><input class="field" id="np-x" placeholder="10 digits" inputmode="numeric" autocomplete="off">
      <label class="f" for="np-b">Bed</label><input class="field" id="np-b" inputmode="numeric" autocomplete="off" placeholder="For example, 9">
      <button class="btn green round push" type="submit">Add patient</button></form>`},
    assign:{title:'Assign a task', html:()=>`${bar('Assign a task')}<div class="body">${S.assign.for!==undefined?chip(S.patients[S.assign.for]):''}
      <fieldset><legend id="at">What needs doing?</legend>${radio('at',['Complete an MFRA','Take the patient to the toilet','Lying and standing blood pressure','Footwear check','Check the call bell is in reach','Move the bed nearer the toilet'], S.assign.t, 'atask')}</fieldset>
      <button class="btn solid round push" data-act="assignnext">Choose who</button></div>`},
    team:{title:'Our team', html:()=>{ const t=S.assign.t!==undefined; const grp=(k,l)=>`<h2>${l}</h2>${S.team.filter(m=>m.on===k).map(m=>`<button class="patient ${m.s==='Busy'?'urgent':m.s==='Available'?'complete':''}" ${k==='off'||!t?'aria-disabled="true" style="cursor:default"':''} data-act="pick" data-n="${m.n}">${face(m.n.length,30)}<span><span class="nm">${m.n}</span><span class="meta">${m.r}</span></span><span class="st">${m.s}</span></button>`).join('')}`;
      return `${bar(t?'Choose who':'Our team')}<div class="body">${t?`<p class="note-text" style="margin-top:0">Task: <b>${['Complete an MFRA','Toilet assistance','Lying and standing BP','Footwear check','Call bell check','Move bed nearer the toilet'][S.assign.t]}</b>${S.assign.for!==undefined?' for '+esc(S.patients[S.assign.for].n):''}</p>`:'<p class="muted" style="margin-top:0">Who’s on today. To give someone a task, use Assign a task.</p>'}
      ${grp('shift','On shift')}${grp('call','On call')}${grp('off','Off shift')}</div>`}},
    swarm:{title:'Post-fall SWARM huddle', html:()=>{ const st=SWARM[S.swarm.i]; return `${bar('SWARM huddle')}<div class="body">${chip(S.patients[0])}
      <div class="step-dots" aria-hidden="true">${SWARM.map((_,i)=>`<i class="${i<=S.swarm.i?'on':''}"></i>`).join('')}</div><p class="muted" style="text-align:center;margin:0">Step ${S.swarm.i+1} of ${SWARM.length}</p>
      <h2 style="font-size:1.25rem;text-align:center">${st.t}</h2><p style="text-align:center">${st.b}</p>
      ${S.swarm.i===SWARM.length-1?'<label class="f" for="sw-a">Agreed action</label><textarea class="field" id="sw-a">Move Jean nearer the toilet and add a 2-hourly toileting round. Owner: Aisha. By: today.</textarea>':''}
      <div class="row push">${S.swarm.i?'<button class="btn round" data-act="swprev">Back</button>':''}<button class="btn solid round" data-act="swnext">${S.swarm.i<SWARM.length-1?'Next step':'Finish huddle'}</button></div></div>`}},
    debriefs:{title:'Debriefs to sign off', html:()=>`${bar('Debriefs')}<div class="body"><p class="muted" style="margin-top:0">Post-fall debriefs from your team.</p>
      ${S.debriefs.map((d,i)=>`<div class="card"><p style="margin:0;font-weight:600">${d.p}</p><p class="muted" style="margin:0">${d.d} · by ${d.by}</p>${d.signed?'<p style="margin:6px 0 0;color:var(--green-d);font-weight:600">✓ Signed off</p>':`<button class="btn green round" style="margin:8px 0 0" data-act="sign" data-i="${i}">Sign off</button>`}</div>`).join('')}</div>`}
  };

  /* ---------- engine ---------- */
  const ALL = Object.assign({}, STAFF, MANAGER);
  const say = t => { live.textContent=''; setTimeout(()=>live.textContent=t, 30); };
  function render(focusHead=true){
    const id = S.stack[S.stack.length-1], sc = ALL[id];
    phone.className = 'phone ' + (sc.cls||'') + (S.contrast?' hc':'');
    document.documentElement.style.fontSize = S.large ? '18px' : '16px';
    screen.innerHTML = sc.html();
    if(!screen.querySelector('h1')){ const h=document.createElement('h1'); h.id='h'; h.className='sr'; h.textContent=sc.title; screen.prepend(h); }
    screen.setAttribute('aria-label', sc.title);
    document.querySelectorAll('.switch [data-app]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.app===S.app)));
    const c = document.getElementById('chat'); if(c) c.scrollTop = c.scrollHeight;
    const ps = document.getElementById('ps'); if(ps){ ps.addEventListener('input', ()=>{ S.q=ps.value; render(false); const n=document.getElementById('ps'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }); }
    const rng = document.getElementById('rng'); if(rng){ rng.addEventListener('input', ()=>{ S.qn.v=+rng.value; document.getElementById('rngout').textContent=rng.value+' out of 10'; }); }
    const qt = document.getElementById('qtxt'); if(qt){ qt.addEventListener('input', ()=>S.qn.txt=qt.value); }
    if(focusHead && started){ const h=screen.querySelector('#h, h1, .clock'); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); } }
  }
  let started=false;
  const go = id => { S.stack.push(id); render(); };
  const replace = id => { S.stack[S.stack.length-1]=id; render(); };
  const back = () => { if(S.stack.length>1){ S.stack.pop(); render(); } };
  const home = () => { S.stack=[S.app==='staff'?'home':'mhome']; render(); };
  function toast(t){ let el=screen.querySelector('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; el.setAttribute('aria-hidden','true'); screen.appendChild(el); } el.textContent=t; requestAnimationFrame(()=>el.classList.add('on')); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2600); say(t); }
  function setApp(a){ const keep={avatar:S.avatar, large:S.large, contrast:S.contrast, lang:S.lang}; S=Object.assign(fresh(), keep); S.app=a; S.stack=[a==='staff'?'lock':'mhome']; render(); }

  document.addEventListener('submit', e=>{
    const f=e.target.dataset.form; if(!f) return; e.preventDefault();
    if(f==='chat'){ const inp=document.getElementById('chatin'); ask(inp.value.trim()); }
    if(f==='addpatient'){ const n=document.getElementById('np-n').value.trim(); if(!n){ document.getElementById('np-n').setAttribute('aria-invalid','true'); document.getElementById('np-n').focus(); return toast('Add the patient’s name first.'); }
      S.patients.push({n, bed:+(document.getElementById('np-b').value)||9, cfs:5, st:'soon', age:80, mfra:'not yet done', falls:0, cfsHist:[5,5,5,5]}); back(); toast(n+' added. MFRA due within 24 hours.'); }
  });
  function ask(q){ if(!q) return; S.chatlog=S.chatlog||[{w:'them',t:'Hi Alan, how can I help today?'}]; S.chatlog.push({w:'me',t:q}); const a=CHAT[q]||'Good question. Check the patient’s latest MFRA first, then talk it through with the nurse in charge. I’ve saved this to your coach tips.'; S.chatlog.push({w:'them',t:a}); render(false); document.getElementById('chatin').focus(); say('Coach: '+a); }

  document.addEventListener('click', e=>{
    const el = e.target.closest('[data-go],[data-act],[data-app]'); if(!el || el.getAttribute('aria-disabled')==='true') return;
    started=true; const d = el.dataset;
    if(d.go){ if(d.go==='menu' && S.app==='manager') return go('mmenu'); if(d.go==='debrief') S.debrief={i:0,a:{}}; if(d.go==='summary') S.sum=0; if(d.go==='log1') S.log={}; if(d.go==='team') S.assign={}; if(d.go==='patients') S.q=''; return go(d.go); }
    if(d.app && !d.act) return setApp(d.app);
    switch(d.act){
      case 'back': return back();
      case 'home': return home();
      case 'restart': return setApp(S.app);
      case 'app': return setApp(d.app);
      case 'assist': return toast('Help requested. The nurse in charge has been alerted to Bay 2.');
      case 'toast': return toast(d.t);
      case 'cheer': { const on=el.getAttribute('aria-pressed')!=='true'; el.setAttribute('aria-pressed',String(on)); el.textContent=on?'♥ 1':'Cheer'; return; }
      case 'toqn': S.qn={i:0,v:7,txt:''}; return go('questionnaire');
      case 'toquiz': S.quiz={i:0,right:0,picked:null}; return go('quiz');
      case 'task': { const t=S.tasks[+d.i]; if(t.mfra!==undefined && !t.done){ S.mfra={p:t.mfra, i:0, a:{}, why:false}; return go('mfra'); } if(t.cta && !t.done){ S.qn={i:0,v:7,txt:''}; return go('questionnaire'); } t.done=!t.done; if(t.done) S.points+=10; render(false); screen.querySelectorAll('[data-act="task"]')[+d.i].focus(); return toast(t.done?'Done: +10 points':'Marked as not done'); }
      case 'logp': S.log.p=+d.i; return render(false);
      case 'logw': S.log.w=+d.i; return render(false);
      case 'log1next': if(S.log.p===undefined||S.log.w===undefined) return toast('Choose the patient and whether you saw it.'); return go('log2');
      case 'loginj': S.log.inj=+d.i; render(false); if(+d.i===2) toast('Help is on the way. The nurse in charge has been alerted.'); return;
      case 'logwhere': S.log.where=+d.i; return render(false);
      case 'log2next': if(S.log.inj===undefined||S.log.where===undefined) return toast('Answer both questions to log the fall.'); S.points+=20; return go('logged');
      case 'dbopt': S.debrief.a[S.debrief.i]=+d.i; return render(false);
      case 'dbprev': S.debrief.i--; return render();
      case 'dbnext': if(S.debrief.a[S.debrief.i]===undefined) return toast('Choose an answer to continue.'); if(S.debrief.i<DEBRIEF.length-1){ S.debrief.i++; return render(); } return replace('debriefdone');
      case 'sum': S.sum+= +d.d; return render();
      case 'scenstart': S.scen={i:0,score:0}; return go('scenario');
      case 'scen': S.scen.score+=SCEN[S.scen.i].o[+d.i][1]; if(S.scen.i<SCEN.length-1){ S.scen.i++; return render(); } S.points+=25; return replace('scendone');
      case 'hzstart': S.hz=[]; return go('hazard');
      case 'hz': { const i=+d.i; if(!S.hz.includes(i)){ S.hz.push(i); render(false); screen.querySelector(`[data-act="hz"][data-i="${i}"]`).focus(); return toast('Found: '+HAZ[i].t); } return; }
      case 'hzdone': S.points+=40; home(); return toast('All four found: +40 points');
      case 'quiz': if(S.quiz.picked!==null) return; S.quiz.picked=+d.i; if(+d.i===QUIZ[S.quiz.i].a) S.quiz.right++; render(false); { const v=screen.querySelector('.verdict'); say(v.textContent+'. '+QUIZ[S.quiz.i].why); screen.querySelector('[data-act="quiznext"]').focus(); } return;
      case 'quiznext': if(S.quiz.i<QUIZ.length-1){ S.quiz.i++; S.quiz.picked=null; return render(); } S.points+=S.quiz.right*5; return replace('quizdone');
      case 'qn': S.qn.i+= +d.d; return render();
      case 'qnsend': { const t=S.tasks.find(x=>x.cta); if(t) t.done=true; S.streak++; home(); return toast('Thanks! Streak boosted to '+S.streak+' days.'); }
      case 'skin': S.avatar.skin=d.c; return render(false);
      case 'hair': S.avatar.hair=d.c; return render(false);
      case 'saveprofile': back(); return toast('Avatar saved.');
      case 'lang': S.lang=d.l; render(false); return toast(d.l==='English'?'Language: English':d.l+' is coming soon. Showing English for now.');
      case 'large': S.large=!S.large; return render(false);
      case 'contrast': S.contrast=!S.contrast; return render(false);
      case 'ask': return ask(d.q);
      case 'patient': S.sel=+d.i; return go('record');
      case 'toassign': S.assign={}; return go('assign');
      case 'assignfor': S.assign={for:+d.i}; return go('assign');
      case 'atask': S.assign.t=+d.i; return render(false);
      case 'assignnext': if(S.assign.t===undefined) return toast('Choose a task first.'); return go('team');
      case 'pick': { if(S.assign.t===undefined) return; const m=S.team.find(x=>x.n===d.n); if(m.on==='off') return; m.s='Busy'; S.assign={}; home(); return toast('Task sent to '+d.n+'.'); }
      case 'toswarm': S.swarm={i:0}; return go('swarm');
      case 'swprev': S.swarm.i--; return render();
      case 'swnext': if(S.swarm.i<SWARM.length-1){ S.swarm.i++; return render(); } S.patients[0].swarm='27/11/25'; home(); return toast('Huddle saved to Jean Smith’s record.');
      case 'mfrastart': S.mfra={p:+d.i, i:0, a:{}, why:false}; return go('mfra');
      case 'mfraopt': { const i=S.mfra.i, k=+d.i; if(MFRA[i].multi){ let a=S.mfra.a[i]||[]; if(k===0) a=a.includes(0)?[]:[0]; else { a=a.filter(x=>x!==0); a=a.includes(k)?a.filter(x=>x!==k):a.concat(k); } S.mfra.a[i]=a; } else S.mfra.a[i]=k; render(false); screen.querySelectorAll('[data-act="mfraopt"]')[k].focus(); return; }
      case 'mfrawhy': S.mfra.why=!S.mfra.why; render(false); screen.querySelector('[data-act="mfrawhy"]').focus(); return;
      case 'mfraprev': S.mfra.i--; S.mfra.why=false; return render();
      case 'mfranext': { const a=S.mfra.a[S.mfra.i]; if(a===undefined || (Array.isArray(a)&&!a.length)) return toast('Choose an answer to continue.'); if(S.mfra.i<MFRA.length-1){ S.mfra.i++; S.mfra.why=false; return render(); }
        const p=S.patients[S.mfra.p]; p.st='complete'; p.mfra='today'; S.points+=30; const t=S.tasks.find(x=>x.mfra===S.mfra.p); if(t) t.done=true; return replace('mfradone'); }
      case 'sign': S.debriefs[+d.i].signed=true; render(false); return toast('Debrief signed off.');
    }
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.stack.length>1){ started=true; back(); } });

  // ?app=manager opens straight into the manager app
  setApp(new URLSearchParams(location.search).get('app')==='manager'?'manager':'staff');
})();
</script>
</body>
</html>
